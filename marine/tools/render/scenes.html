  Stand-in photography renderer.
  Every image on the site is a slot (see src/site.config.json → photos). Until
  the client's own photographs are dropped in, these slots are filled with
  stills rendered here: sea, sky, a hull flank, teak, varnished brightwork and
  stainless rail. Nothing here ships with the site; only the exported .webp do.

<script type="module">
import * as THREE from "three";
import { Sky } from "three/addons/objects/Sky.js";

import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const P = new URLSearchParams(location.search);
const SCENE = P.get("scene") || "hero";
const W = +P.get("w") || 1600, H = +P.get("h") || 1000;

// ---------- deterministic random ----------
let seed = +(P.get("seed") || 7);

// ---------- tileable water normal map (sum of integer-frequency waves) ----------
function waterNormals(size = 512) {

  }
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let dx = 0, dy = 0;
    for (const [kx, ky, ph, am] of waves) {
      const t = 2 * Math.PI * (kx * x + ky * y) / size + ph, c0 = Math.cos(t) * am;

    const n = new THREE.Vector3(-dx, -dy, 1).normalize(), o = (y * size + x) * 4;
    img.data[o] = (n.x * .5 + .5) * 255; img.data[o + 1] = (n.y * .5 + .5) * 255; img.data[o + 2] = (n.z * .5 + .5) * 255; img.data[o + 3] = 255;

}

// ---------- value noise for wood ----------
function makeNoise(s) {
  const p = new Float32Array(256 * 256); for (let i = 0; i < p.length; i++) p[i] = rnd();
  const v = (x, y) => p[((y & 255) << 8) | (x & 255)];
  const sm = t => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
}
const noise = makeNoise();
const fbm = (x, y, o = 4) => { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f); f *= 2.03; a *= .5; } return s; };

// wood: grain runs along U. planks = number of planks across V (0 = single board).
function woodTexture({ w = 2048, h = 2048, planks = 0, base = [150, 95, 52], dark = [92, 55, 28], caulk = 5, seam = 0 } = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), img = g.createImageData(w, h);
  const rough = document.createElement("canvas"); rough.width = w; rough.height = h;
  const rg = rough.getContext("2d"), rimg = rg.createImageData(w, h);
  const ph = planks ? h / planks : h;
  const tones = Array.from({ length: Math.max(1, planks) }, () => [0.82 + rnd() * .3, rnd() * 400, (rnd() - .5) * .12]);
  const butt = Array.from({ length: Math.max(1, planks) }, () => rnd() * w);
  for (let y = 0; y < h; y++) {
    const pi = Math.floor(y / ph), py = y - pi * ph, [tone, off, hue] = tones[pi % tones.length];
    for (let x = 0; x < w; x++) {
      const u = (x + off * 7) / w, v = y / h;
      const warp = fbm(u * 3, v * 14) * 2.2;
      let ring = Math.sin((v * (planks ? planks * 26 : 40) + warp * 3 + fbm(u * 1.2, v * 3) * 4) * Math.PI);
      ring = Math.pow(Math.abs(ring), 0.55);
      const streak = fbm(u * 1.5, v * 120 + off) * .45 + fbm(u * 6, v * 900 + off) * .35 + fbm(u * 40, v * 260) * .2;
      let m = Math.min(1, Math.max(0, ring * .45 + streak * .7 - .1));
      const k = (i) => (base[i] * (1 - m) + dark[i] * m) * tone * (1 + (i === 0 ? hue : -hue * .5));
      let r = k(0), gg = k(1), b = k(2), ro = 150 + m * 60;

      rimg.data[o] = rimg.data[o + 1] = rimg.data[o + 2] = ro; rimg.data[o + 3] = 255;

  const r = new THREE.CanvasTexture(rough); t.wrapS = t.wrapT = r.wrapS = r.wrapT = THREE.RepeatWrapping;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 20000);
const pmrem = new THREE.PMREMGenerator(renderer);

function makeSky({ elev = 2, azim = 180, turbidity = 6, rayleigh = 2.2, mie = .006, mieG = .86 }) {
  const sky = new Sky(); sky.scale.setScalar(10000);
  const u = sky.material.uniforms;
  u.turbidity.value = turbidity; u.rayleigh.value = rayleigh; u.mieCoefficient.value = mie; u.mieDirectionalG.value = mieG;
  const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elev), THREE.MathUtils.degToRad(azim));
  u.sunPosition.value.copy(sun);
  return { sky, sun };
}
function envFromSky(sky, extra) {
  const s = new THREE.Scene(); s.add(sky.clone()); if (extra) s.add(extra);
  return pmrem.fromScene(s).texture;
}
function makeWater(sun, { color = 0x06141f, distortion = 2.2, size = 1, repeat = 1, sunColor = 0xffe2b8 } = {}) {
  const geo = new THREE.PlaneGeometry(20000, 20000);
  const w = new Water(geo, { textureWidth: 1024, textureHeight: 1024, waterNormals: waterNormals(), sunDirection: sun.clone().normalize(),
    sunColor, waterColor: color, distortionScale: distortion, fog: false, alpha: 1 });

  return w;
}

// ---------- yacht ----------
const navyGloss = new THREE.MeshPhysicalMaterial({ color: 0x0b1a2e, roughness: .18, metalness: 0, clearcoat: 1, clearcoatRoughness: .03 });
const whiteGel = new THREE.MeshPhysicalMaterial({ color: 0xe9e6de, roughness: .3, clearcoat: .8, clearcoatRoughness: .08 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0a0f16, roughness: .05, metalness: .6, clearcoat: 1 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .07 });
const warm = (i = 3) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffc98a, emissiveIntensity: i });

function hullGeometry({ L = 32, B = 3.6, stations = 80, ring = 28 } = {}) {
  // x from stern (-L/2) to bow (+L/2); half-beam, sheer and keel per station
  const pos = [];
  const sec = t => {
    const fwd = Math.max(0, (t - .42) / .58);
    const hb = B * Math.sqrt(Math.max(0, 1 - Math.pow(fwd, 2.1))) * (t < .04 ? .96 : 1);
    const sheer = 2.2 + 1.5 * Math.pow(t, 2.6);

  };

  for (let i = 0; i <= stations; i++) {
    const t = i / stations, x = -L / 2 + t * L, { hb, sheer, keel } = sec(t), row = [];
    for (let j = 0; j <= ring; j++) {
      const s = j / ring; // 0 keel → 1 sheer

      if (s < .45) { const k = s / .45; z = hb * .86 * Math.pow(k, .9); y = keel + (keel * -.25 - keel) * k; }
      else { const k = (s - .45) / .55; z = hb * (.86 + .14 * Math.sin(k * Math.PI / 2)); y = keel * .75 + (sheer - keel * .75) * k; }
      row.push([x, y, z]);
    }
    pts.push(row);
  }
  for (let i = 0; i < stations; i++) for (let j = 0; j < ring; j++) for (const side of [1, -1]) {
    const a = pts[i][j], b = pts[i + 1][j], c = pts[i + 1][j + 1], d = pts[i][j + 1];
    const q = p => [p[0], p[1], p[2] * side];
    const tri = side > 0 ? [a, b, c, a, c, d] : [a, c, b, a, d, c];
    tri.forEach(p => pos.push(...q(p)));
  }

  const r0 = pts[0];
  for (let j = 0; j < ring; j++) { const a = r0[j], b = r0[j + 1]; pos.push(a[0], a[1], a[2], b[0], b[1], -b[2], b[0], b[1], b[2], a[0], a[1], a[2], a[0], a[1], -a[2], b[0], b[1], -b[2]); }

}
function roundedDeck(x0, x1, hb, nose) {

  s.quadraticCurveTo(x1, -hb * .7, x1, 0); s.quadraticCurveTo(x1, hb * .7, x1 - nose, hb);

}
function deckhouse(x0, x1, hb, nose, y, hgt, mat, rake = .6) {
  const g = new THREE.ExtrudeGeometry(roundedDeck(x0, x1, hb, nose), { depth: hgt, bevelEnabled: true, bevelSize: .12, bevelThickness: .12, bevelSegments: 3, curveSegments: 16 });

  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const yy = p.getY(i), k = yy / hgt; p.setX(i, p.getX(i) - Math.max(0, p.getX(i) - (x1 - nose * 2)) * k * rake); p.setZ(i, p.getZ(i) * (1 - k * .08)); }

}
function makeYacht({ lights = true } = {}) {
  const grp = new THREE.Group();
  const { g, sec, L } = hullGeometry();
  grp.add(new THREE.Mesh(g, navyGloss));
  // deck plate
  const deckY = 2.25;
  grp.add(deckhouse(-L / 2 + .3, L / 2 - 1.5, 3.35, 9, deckY - .1, .14, whiteGel, 0));
  // main superstructure, window band, flybridge
  grp.add(deckhouse(-9, 7, 3.0, 6.5, deckY, 1.0, whiteGel, .3));
  grp.add(deckhouse(-8.8, 6.6, 3.02, 6.3, deckY + 1.0, .95, glass, .9));
  grp.add(deckhouse(-9, 5.2, 2.95, 5.5, deckY + 1.95, .35, whiteGel, .9));
  grp.add(deckhouse(-6.5, 3.2, 2.7, 4.5, deckY + 2.3, .9, whiteGel, 1.2));
  grp.add(deckhouse(-6.3, 2.9, 2.72, 4.2, deckY + 2.65, .45, glass, 1.4));

    for (let i = 0; i < 7; i++) {
      const x = -6 + i * 2.2, { hb } = sec((x + L / 2) / L);
      for (const z of [1, -1]) { const p = new THREE.Mesh(new THREE.PlaneGeometry(.55, .16), warm(2.4)); p.position.set(x, 1.35, z * (hb + .02)); p.rotation.y = z > 0 ? 0 : Math.PI; grp.add(p); }
    }
    for (const z of [1, -1]) {
      const band = new THREE.Mesh(new THREE.PlaneGeometry(10, .55), warm(.9)); band.position.set(-2.3, deckY + 1.45, z * 3.05); band.rotation.y = z > 0 ? 0 : Math.PI; grp.add(band);
      const fb = new THREE.Mesh(new THREE.PlaneGeometry(5.5, .3), warm(.6)); fb.position.set(-1.8, deckY + 2.9, z * 2.75); fb.rotation.y = z > 0 ? 0 : Math.PI; grp.add(fb);
    }
    const aft = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 1.4), warm(1.4)); aft.position.set(-9.12, deckY + .8, 0); aft.rotation.y = -Math.PI / 2; grp.add(aft);
    const ml = new THREE.Mesh(new THREE.SphereGeometry(.09), new THREE.MeshBasicMaterial({ color: 0xffffff })); ml.position.set(-3, deckY + 5.45, 0); grp.add(ml);
  }
  return grp;
}

// ---------- post ----------
function compose({ focus, aperture = .0, maxblur = .0, bloom = 0, bloomR = .5, bloomT = .9 } = {}) {
  const comp = new EffectComposer(renderer); comp.setPixelRatio(1); comp.setSize(W, H);

  if (bloom) comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom, bloomR, bloomT));

}
// film grain + vignette baked last on a 2D canvas so all stills share one treatment
function finish({ grain = 7, vignette = .35, nd = 0, horizon = .5 } = {}) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  g.drawImage(renderer.domElement, 0, 0);
  if (nd) { // graduated darkening of the foreground water, like a reverse ND grad on a lens
    const n = g.createLinearGradient(0, H * horizon, 0, H); n.addColorStop(0, "rgba(3,10,20,0)"); n.addColorStop(.35, `rgba(3,10,20,${nd * .6})`); n.addColorStop(1, `rgba(3,10,20,${nd})`);

  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(2,6,14,${vignette})`); g.fillStyle = v; g.fillRect(0, 0, W, H);

  for (let i = 0; i < d.data.length; i += 4) {
    const r = d.data[i], gg = d.data[i + 1], b = d.data[i + 2], l = (r * .3 + gg * .59 + b * .11) / 255, sh = Math.pow(1 - l, 3);
    d.data[i] = r * (1 - sh * .25) + 4 * sh; d.data[i + 1] = gg * (1 - sh * .12) + 9 * sh; d.data[i + 2] = b + 20 * sh;

  g.putImageData(d, 0, 0);
  c.id = "out"; c.style.cssText = "position:fixed;inset:0"; document.body.appendChild(c);

const portrait = H > W;
const scenes = {
  // blue hour, sun just under the horizon, yacht at anchor at mid distance
  hero() {
    const { sky, sun } = makeSky({ elev: +(P.get("e") || -2.4), azim: 250, turbidity: 2, rayleigh: +(P.get("r") || 3), mie: .005, mieG: .95 });
    scene.add(sky);
    scene.environment = envFromSky(sky);
    const water = makeWater(sun, { color: 0x020a14, distortion: 3.4, size: 7, sunColor: 0xffb070 }); scene.add(water);
    const y = makeYacht(); y.rotation.y = .55; y.position.set(portrait ? 10 : 34, -.15, -150); scene.add(y);
    const hemi = new THREE.HemisphereLight(0x6a88b8, 0x050a12, .35); scene.add(hemi);
    const dl = new THREE.DirectionalLight(0xffb27a, .5); dl.position.copy(sun).multiplyScalar(100); scene.add(dl);
    renderer.toneMappingExposure = +(P.get("x") || .9);
    camera.fov = portrait ? 46 : 28; camera.position.set(0, 1.9, 0); camera.lookAt(portrait ? 5 : -4, portrait ? -40 : 5.4, -150); camera.updateProjectionMatrix();
    return compose({ bloom: .55, bloomR: .4, bloomT: .55 });
  },
  // after sunset, wide horizon, yacht small and further off — the cinematic break
  break() {
    const { sky, sun } = makeSky({ elev: -2.2, azim: 200, turbidity: 12, rayleigh: 3, mie: .01, mieG: .93 });
    scene.add(sky); scene.environment = envFromSky(sky);
    const water = makeWater(sun, { color: 0x020912, distortion: 2.6, size: 8, sunColor: 0xff9a5a }); scene.add(water);
    const y = makeYacht(); y.rotation.y = -1.15; y.position.set(portrait ? -6 : -70, -.15, -330); scene.add(y);
    scene.add(new THREE.HemisphereLight(0x50709e, 0x040810, .3));
    renderer.toneMappingExposure = .62;
    camera.fov = portrait ? 50 : 24; camera.position.set(0, 3, 0); camera.lookAt(0, portrait ? 9 : 6, -330); camera.updateProjectionMatrix();
    return compose({ bloom: .6, bloomR: .45, bloomT: .5 });
  },
  // raking view along a glossy navy hull flank, water lapping at the boot stripe
  hull() {
    const { sky, sun } = makeSky({ elev: 7, azim: 150, turbidity: 5, rayleigh: 1.6, mie: .005, mieG: .85 });
    scene.add(sky); scene.environment = envFromSky(sky);
    scene.add(makeWater(sun, { color: 0x062033, distortion: 3.2, size: 6, sunColor: 0xfff0d8 }));
    const { g } = hullGeometry({ L: 32, B: 3.6, stations: 160, ring: 60 });
    const hull = new THREE.Mesh(g, navyGloss); hull.position.y = .25; scene.add(hull);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(32, .06, 7.4), new THREE.MeshPhysicalMaterial({ color: 0xd9c49a, metalness: .6, roughness: .25, clearcoat: 1 }));
    stripe.position.set(0, 1.3, 0); scene.add(stripe);
    const rub = new THREE.Mesh(new THREE.BoxGeometry(31.4, .16, 7.36), steelMat); rub.position.set(0, 2.42, 0); scene.add(rub);
    const dl = new THREE.DirectionalLight(0xfff0dd, 2); dl.position.copy(sun).multiplyScalar(100); scene.add(dl);
    renderer.toneMappingExposure = .5;
    camera.fov = portrait ? 48 : 34; camera.position.set(-11, 1.05, 6.4); camera.lookAt(2, 1.5, 3.7); camera.updateProjectionMatrix();
    return compose({ focus: 8, aperture: .0006, maxblur: .006 });
  },
  // teak deck with a stainless cleat, low raking warm light, shallow focus
  teak(macro, bare) {
    const { sky, sun } = makeSky({ elev: 9, azim: 120, turbidity: 6, rayleigh: 1.4 });
    scene.background = new THREE.Color(0x0a1420);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), .02).texture;
    const tex = woodTexture({ planks: 30, base: [150, 100, 58], dark: [96, 60, 32], caulk: 5, seam: 1 });
    tex.map.repeat.set(1, 1);
    const deck = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8, 1, 1), new THREE.MeshStandardMaterial({ ...tex, roughness: .9 }));
    deck.rotation.x = -Math.PI / 2; deck.rotation.z = .32; scene.add(deck);

    const hp = []; for (let i = 0; i <= 40; i++) { const t = i / 40, x = -.12 + t * .24, r = .019 - .007 * Math.pow(Math.abs(x) / .12, 2); hp.push(new THREE.Vector2(Math.max(.0001, Math.sqrt(Math.max(0, 1 - Math.pow(Math.max(0, Math.abs(x) - .108) / .012, 2))) * r), x)); }
    const horn = new THREE.Mesh(new THREE.LatheGeometry(hp, 64), steelMat); horn.rotation.z = Math.PI / 2; horn.position.y = .064; cleat.add(horn);
    for (const x of [-.045, .045]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(.016, .026, .06, 32), steelMat); b.position.set(x, .03, 0); cleat.add(b); }
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(.05, .052, .006, 48), steelMat); pad.scale.set(1.7, 1, .7); cleat.add(pad);
    cleat.rotation.y = .32 + Math.PI / 2; cleat.position.set(.06, 0, .12); if (!bare) scene.add(cleat);
    const dl = new THREE.DirectionalLight(0xffd7a8, 3.2); dl.position.set(-2, .7, -1.2); scene.add(dl);

    camera.fov = portrait ? 40 : 30; camera.position.set(-.02, .34, .52); camera.lookAt(.05, 0, .08); camera.updateProjectionMatrix();
    return compose({ focus: .55, aperture: .06, maxblur: .02 });
  },
  // bare deck, looking along the planks: brightwork for the woodworking service
  planks() {
    scenes.teak(false, true);
    camera.fov = 34; camera.position.set(-.55, .22, .05); camera.lookAt(.3, 0, .02); camera.updateProjectionMatrix();
    return compose({ focus: .55, aperture: .05, maxblur: .02 });
  },
  cleat() {
    const comp = scenes.teak(true);
    camera.fov = 28; camera.position.set(-.22, .17, .4); camera.lookAt(.06, .045, .1); camera.updateProjectionMatrix();
    return compose({ focus: .34, aperture: .09, maxblur: .025 });
  },
  // varnished brightwork: a curving mahogany cap rail against a dusk sea
  varnish() {
    const { sky, sun } = makeSky({ elev: 3, azim: 210, turbidity: 8, rayleigh: 2.4, mie: .008, mieG: .9 });
    scene.add(sky); scene.environment = envFromSky(sky);
    scene.add(makeWater(sun, { color: 0x04101c, distortion: 2, size: 2 }));
    const tex = woodTexture({ w: 2048, h: 512, planks: 0, base: [128, 52, 26], dark: [62, 22, 10] });
    tex.map.repeat.set(3, 1); tex.roughnessMap.repeat.set(3, 1);
    const wood = new THREE.MeshPhysicalMaterial({ map: tex.map, roughness: .5, clearcoat: 1, clearcoatRoughness: .02, sheen: 0 });
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-1.4, 1.05, 2.4), new THREE.Vector3(-.4, 1.02, .4), new THREE.Vector3(.6, 1.0, -1.6), new THREE.Vector3(2.2, 1.0, -4.5), new THREE.Vector3(4.5, 1.0, -8)]);
    const prof = new THREE.Shape(); const rw = .075, rh = .045, rr = .03;
    prof.moveTo(-rw + rr, -rh); prof.lineTo(rw - rr, -rh); prof.quadraticCurveTo(rw, -rh, rw, -rh + rr); prof.lineTo(rw, rh - rr); prof.quadraticCurveTo(rw, rh, rw - rr, rh);
    prof.lineTo(-rw + rr, rh); prof.quadraticCurveTo(-rw, rh, -rw, rh - rr); prof.lineTo(-rw, -rh + rr); prof.quadraticCurveTo(-rw, -rh, -rw + rr, -rh);
    const rail = new THREE.Mesh(new THREE.ExtrudeGeometry(prof, { steps: 300, extrudePath: curve, curveSegments: 12 }), wood); scene.add(rail);
    // gelcoat bulwark beneath the rail
    const bw = new THREE.Mesh(new THREE.TubeGeometry(curve, 200, .12, 4), whiteGel); bw.scale.set(1, 1, 1); bw.position.y = -.17; scene.add(bw);
    const hull = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curve.points.map(p => p.clone().add(new THREE.Vector3(0, -.9, .02)))), 200, .75, 6), navyGloss); scene.add(hull);
    const dl = new THREE.DirectionalLight(0xffc690, 2.4); dl.position.copy(sun).multiplyScalar(100); scene.add(dl);
    renderer.toneMappingExposure = .62;
    camera.fov = portrait ? 46 : 32; camera.position.set(-1.6, 1.32, 3.25); camera.lookAt(.2, .96, .1); camera.updateProjectionMatrix();
    return compose({ focus: 1.9, aperture: .006, maxblur: .01 });
  },
  // polished stainless bow rail and stanchions, sea out of focus behind
  steel() {
    const { sky, sun } = makeSky({ elev: 4, azim: 230, turbidity: 7, rayleigh: 2, mie: .007, mieG: .88 });
    scene.add(sky);
    const room = new RoomEnvironment(); room.scale.setScalar(.3);
    scene.environment = envFromSky(sky);
    scene.add(makeWater(sun, { color: 0x05121f, distortion: 2.4, size: 1.6 }));
    const pts = [new THREE.Vector3(-2.2, 1.0, 2.6), new THREE.Vector3(-1, 1.0, .8), new THREE.Vector3(.4, 1.0, -1.2), new THREE.Vector3(2.4, 1.02, -3.4), new THREE.Vector3(5, 1.06, -5.4)];
    const curve = new THREE.CatmullRomCurve3(pts);
    const mirror = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 1, roughness: .045 });
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 300, .028, 32), mirror));
    const low = new THREE.CatmullRomCurve3(pts.map(p => p.clone().add(new THREE.Vector3(0, -.48, 0))));
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(low, 300, .016, 24), mirror));
    for (let i = 0; i <= 10; i++) {
      const p = curve.getPointAt(i / 10);
      const s = new THREE.Mesh(new THREE.CylinderGeometry(.018, .02, 1.0, 32), mirror); s.position.set(p.x, p.y - .5, p.z); scene.add(s);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(.035, .05, .06, 32), mirror); base.position.set(p.x, .03, p.z); scene.add(base);
    }
    const deck = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshPhysicalMaterial({ color: 0xd8d3c6, roughness: .45, clearcoat: .4 }));
    deck.rotation.x = -Math.PI / 2; deck.position.set(-14, 0, 0);
    const toe = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p.x + .05, -.15, p.z + .05))), 200, .2, 6), whiteGel); scene.add(toe);
    const dl = new THREE.DirectionalLight(0xffd6a6, 3); dl.position.copy(sun).multiplyScalar(100); scene.add(dl);
    renderer.toneMappingExposure = .6;
    camera.fov = portrait ? 44 : 30; camera.position.set(-2.55, 1.18, 3.2); camera.lookAt(-.4, .9, .4); camera.updateProjectionMatrix();
    return compose({ focus: 2.3, aperture: .008, maxblur: .014 });
  },
};
