<!doctype html>
<!-- Share card and icons, rendered by tools/og/shoot.mjs from src/site.config.json -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Jost"; src: url("../../assets/fonts/jost-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #fff; font-family: "Jost", sans-serif; }
  .card { position: relative; display: flex; align-items: center; gap: 64px; width: 1200px; height: 630px; padding: 0 80px; box-sizing: border-box; background: #fff; border-bottom: 14px solid #0d1f36; }
  .card .seal { width: 360px; flex-shrink: 0; filter: drop-shadow(0 20px 34px rgba(13,31,54,.25)); }
  .k { margin: 0 0 18px; font-size: 20px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #b8954f; }
  h1 { margin: 0; font-size: 78px; font-weight: 700; letter-spacing: .03em; line-height: 1; color: #0d1f36; }
  .l { margin: 20px 0 0; font-size: 30px; color: #4d5560; }
  .icon { display: grid; place-items: center; width: 512px; height: 512px; background: #fff; }
  .icon img { width: 94%; }
</style></head><body>
<div class="card" id="card"><img class="seal" id="seal" alt="">
  <div><p class="k">Marine detailing &amp; maintenance<br>UK &amp; Norway</p><h1 id="h1"></h1><p class="l">Exceptional care for exceptional vessels.</p></div>
</div>
<div class="icon" id="icon"><img id="em" alt=""></div>
<script type="module">
  const cfg = await (await fetch("../../src/site.config.json")).json();
  document.getElementById("h1").textContent = cfg.brand.name;
  const big = "../../assets/img/brand/seal-2021.webp";
  const set = async (id, src) => { const i = document.getElementById(id); i.src = src; await i.decode(); };
  await set("seal", big); await set("em", big);
  await document.fonts.ready; window.ready = true;
</script></body></html>
