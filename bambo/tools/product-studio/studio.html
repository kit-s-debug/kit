<!doctype html>
<html><head><meta charset="utf-8">
<style>

</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const RED = 0xc8102e, CHAR = 0x1d1d1f, WHITE = 0xf4f4f2;

await document.fonts.load('900 40px Archivo');
await document.fonts.load('500 40px Archivo');

function font(weight, size, stretch = 100) {
  return `${weight} ${stretch === 100 ? '' : (stretch < 100 ? 'condensed ' : 'expanded ')}${size}px Archivo`;
}

/* ---------- label textures ---------- */
function labelTexture({ title, sub, strength, size, warn = true, wrapRatio = 3.2 }) {
  const h = 1024, w = Math.round(h * wrapRatio);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#fbfbfa'; g.fillRect(0, 0, w, h);
  // the front panel sits at u = 0.5 after we offset; draw everything centred there
  const cx = w * 0.5;
  g.fillStyle = '#c8102e'; g.fillRect(0, 0, w, 120);
  g.fillStyle = '#c8102e'; g.fillRect(0, h - 40, w, 40);
  g.fillStyle = '#ffffff'; g.font = font(900, 64); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.letterSpacing = '18px';
  g.fillText(size, cx, 62);
  g.letterSpacing = '0px';
  g.fillStyle = '#1d1d1f';
  g.font = `900 ${Math.max(...title.split('\n').map(l=>l.length)) > 8 ? 128 : 158}px Archivo`;
  const lines = title.split('\n');
  lines.forEach((l, i) => g.fillText(l.toUpperCase(), cx, 300 + i * 170));
  const y = 300 + lines.length * 170;
  g.font = font(500, 60); g.fillStyle = '#5a5a5e'; g.letterSpacing = '6px';
  g.fillText(sub.toUpperCase(), cx, y + 10);
  g.letterSpacing = '0px';
  // strength chip
  g.fillStyle = '#c8102e';
  const cw = 360, ch = 110; g.beginPath(); g.roundRect(cx - cw / 2, y + 90, cw, ch, 55); g.fill();
  g.fillStyle = '#fff'; g.font = font(800, 62); g.fillText(strength, cx, y + 146);
  // statutory-style warning panel on the side
  const wx = w * 0.12, ww = w * 0.22, wy = 200, wh = 560;
  if (warn) {
  g.fillStyle = '#fff'; g.fillRect(wx, wy, ww, wh);
  g.strokeStyle = '#111'; g.lineWidth = 14; g.strokeRect(wx, wy, ww, wh);
  g.fillStyle = '#111'; g.font = font(800, 54); g.textAlign = 'center';
  ['This product', 'contains nicotine', 'which is a highly', 'addictive', 'substance.'].forEach((t, i) => g.fillText(t, wx + ww / 2, wy + 110 + i * 82));
  }
  // back panel ingredient lines
  g.fillStyle = '#9a9a9e';
  for (let i = 0; i < 9; i++) g.fillRect(w * 0.70, 230 + i * 58, w * (0.16 - (i % 3) * 0.03), 20);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.wrapS = THREE.RepeatWrapping; t.offset.x = 0.5; // put the front panel toward camera
  return t;
}

function boxFaceTexture({ title, sub, w = 1024, h = 1400, front = true }) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#fbfbfa'; g.fillRect(0, 0, w, h);
  if (front) {
    g.fillStyle = '#c8102e'; g.fillRect(0, h * 0.62, w, h * 0.38);
    g.fillStyle = '#1d1d1f'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = '900 128px Archivo';
    title.split('\n').forEach((l, i) => g.fillText(l.toUpperCase(), 80, 260 + i * 140));
    g.font = '500 52px Archivo'; g.fillStyle = '#5a5a5e'; g.letterSpacing = '6px';
    g.fillText(sub.toUpperCase(), 84, 260 + title.split('\n').length * 150 + 10);
    g.letterSpacing = '0px';
    g.fillStyle = '#fff'; g.font = '900 120px Archivo'; g.textAlign = 'left';
    g.fillText(sub.split(' · ')[1] || '', 80, h * 0.62 + 200);
    g.font = '600 46px Archivo'; g.letterSpacing = '8px';
    g.fillText('NICOTINE-FREE HARDWARE', 84, h * 0.62 + 300);
    g.letterSpacing = '0px';
  } else {
    g.fillStyle = '#c8102e'; g.fillRect(0, h * 0.62, w, h * 0.38);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* ---------- geometry helpers ---------- */
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function slab(w, h, d, r, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w - bevel * 2, h - bevel * 2, Math.max(0.01, r - bevel)), {
    depth: d - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 10, curveSegments: 32
  });
  g.translate(0, 0, -(d - bevel * 2) / 2);
  g.computeVertexNormals();
  return g;
}
const mat = {
  anodised: (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, metalness: 0.55, clearcoat: 0.6, clearcoatRoughness: 0.25 }),
  satin: (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, metalness: 0.0, clearcoat: 0.4, clearcoatRoughness: 0.3, sheen: 0.2 }),
  chrome: () => new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.14, metalness: 1 }),
  gunmetal: () => new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.3, metalness: 1 }),
  smoke: () => new THREE.MeshPhysicalMaterial({ color: 0x2a2a2c, roughness: 0.08, metalness: 0, transparent: true, opacity: 0.88, clearcoat: 1 }),
  glass: () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, transparent: true, opacity: 0.28, clearcoat: 1, side: THREE.DoubleSide }),
  liquid: (color = 0xd9a441) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.1, transparent: true, opacity: 0.7 }),
  plastic: (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, metalness: 0, clearcoat: 0.5, clearcoatRoughness: 0.2 }),
};

/* ---------- products ---------- */
function podKit({ color = RED, finish = 'anodised' } = {}) {
  const g = new THREE.Group();
  const bodyMat = finish === 'satin' ? mat.satin(color) : mat.anodised(color);
  const body = new THREE.Mesh(slab(4.4, 8.6, 1.7, 1.4, 0.55), bodyMat);
  body.position.y = 4.3; g.add(body);
  // pod window
  const win = new THREE.Mesh(slab(1.0, 2.6, 0.12, 0.45, 0.05), mat.smoke());
  win.position.set(0, 6.9, 0.84); g.add(win);
  // mouthpiece
  const mp = new THREE.Mesh(slab(3.0, 2.2, 1.05, 0.9, 0.4), mat.smoke());
  mp.position.y = 9.1; g.add(mp);
  // led slit + button
  const led = new THREE.Mesh(slab(1.1, 0.12, 0.06, 0.05, 0.02), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6 }));
  led.position.set(0, 2.2, 0.86); g.add(led);
  // trim seam
  return g;
}

function podPen({ color = CHAR, band = RED } = {}) {
  const g = new THREE.Group();
  const pts = [];
  const R = 0.8;
  pts.push(new THREE.Vector2(0, 0));
  for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(R - 0.25 + Math.sin(a) * 0.25, 0.25 - Math.cos(a) * 0.25)); }
  pts.push(new THREE.Vector2(R, 9.2));
  pts.push(new THREE.Vector2(0, 9.2));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), mat.anodised(color)); g.add(body);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.01, R + 0.01, 0.5, 96), mat.anodised(band)); ring.position.y = 8.6; g.add(ring);
  // pod
  const pod = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.96, R * 0.96, 2.2, 96), mat.smoke()); pod.position.y = 10.3; g.add(pod);
  const mpPts = [new THREE.Vector2(0, 0), new THREE.Vector2(R * 0.92, 0), new THREE.Vector2(R * 0.75, 1.2), new THREE.Vector2(R * 0.42, 2.1), new THREE.Vector2(R * 0.36, 2.2), new THREE.Vector2(0, 2.2)];
  const mp = new THREE.Mesh(new THREE.LatheGeometry(mpPts, 96), mat.plastic(0x18181a)); mp.position.y = 11.4; g.add(mp);
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 48), mat.chrome()); btn.rotation.x = Math.PI / 2; btn.position.set(0, 6.5, R); g.add(btn);
  return g;
}

function modKit({ color = CHAR } = {}) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(slab(5.0, 8.4, 2.8, 0.9, 0.5), mat.anodised(color)); body.position.y = 4.2; g.add(body);
  const screen = new THREE.Mesh(slab(2.4, 1.6, 0.06, 0.2, 0.02), new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.05, clearcoat: 1 }));
  screen.position.set(0, 3.0, 1.41); g.add(screen);
  // screen readout
  const sc = document.createElement('canvas'); sc.width = 512; sc.height = 340; const sg = sc.getContext('2d');
  sg.fillStyle = '#050506'; sg.fillRect(0, 0, 512, 340);
  sg.fillStyle = '#fff'; sg.font = '900 150px Archivo'; sg.textAlign = 'center'; sg.fillText('40W', 256, 200);
  sg.fillStyle = '#c8102e'; sg.fillRect(110, 250, 292, 18);
  const st = new THREE.CanvasTexture(sc); st.colorSpace = THREE.SRGBColorSpace;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.3), new THREE.MeshBasicMaterial({ map: st, toneMapped: false }));
  scr.position.set(0, 3.0, 1.45); g.add(scr);
  const fire = new THREE.Mesh(slab(1.4, 0.7, 0.2, 0.35, 0.08), mat.anodised(RED)); fire.position.set(0, 5.6, 1.45); g.add(fire);
  for (const dx of [-0.45, 0.45]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 32), mat.gunmetal()); b.rotation.x = Math.PI / 2; b.position.set(dx, 1.6, 1.42); g.add(b); }
  // tank
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.7, 96), mat.gunmetal()); base.position.y = 8.75; g.add(base);
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 3.4, 96, 1, true), mat.glass()); glass.position.y = 10.8; g.add(glass);
  const juice = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.08, 2.0, 96), mat.liquid(0xb3122f)); juice.position.y = 10.1; g.add(juice);
  const chim = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 3.4, 48), mat.chrome()); chim.position.y = 10.8; g.add(chim);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.7, 96), mat.gunmetal()); top.position.y = 12.85; g.add(top);
  const dt = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.8, 1.0, 64), mat.smoke()); dt.position.y = 13.7; g.add(dt);
  return g;
}

function bottle({ size = '10ml', title = 'Strawberry\nIce', sub = 'Nic salt', strength = '20MG', cap = RED } = {}) {
  const g = new THREE.Group();
  const big = size !== '10ml';
  const R = big ? 2.0 : 1.3, H = big ? 8.4 : 5.6, sh = big ? 1.1 : 0.9;
  const pts = [new THREE.Vector2(0, 0)];
  for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(R - 0.3 + Math.sin(a) * 0.3, 0.3 - Math.cos(a) * 0.3)); }
  pts.push(new THREE.Vector2(R, H));
  for (let i = 1; i <= 10; i++) { const a = i / 10 * Math.PI / 2; pts.push(new THREE.Vector2(R - (R * 0.55) * (1 - Math.cos(a)), H + sh * Math.sin(a))); }
  pts.push(new THREE.Vector2(R * 0.45, H + sh + 0.1)); pts.push(new THREE.Vector2(0, H + sh + 0.1));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), mat.plastic(0xf7f7f5)); g.add(body);
  // label sleeve
  const lt = labelTexture({ title, sub, strength, warn: !big, size: big ? `${size} shortfill` : `${size}` });
  const lh = H * 0.82;
  const label = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.012, R + 0.012, lh, 128, 1, true), new THREE.MeshPhysicalMaterial({ map: lt, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.2 }));
  label.position.y = H * 0.5; g.add(label);
  // cap
  const capH = big ? 2.0 : 2.4;
  const capR = big ? 1.05 : 0.72;
  const c1 = new THREE.Mesh(new THREE.CylinderGeometry(capR, capR, capH * 0.55, 96), mat.plastic(cap)); c1.position.y = H + sh + capH * 0.3; g.add(c1);
  // ridges
  const ridgeGeo = new THREE.BoxGeometry(0.06, capH * 0.5, 0.08);
  for (let i = 0; i < 48; i++) { const r = new THREE.Mesh(ridgeGeo, c1.material); const a = i / 48 * Math.PI * 2; r.position.set(Math.sin(a) * capR, c1.position.y, Math.cos(a) * capR); r.rotation.y = a; g.add(r); }
  const nozPts = [new THREE.Vector2(0, 0), new THREE.Vector2(capR * 0.82, 0), new THREE.Vector2(capR * 0.42, capH * 0.55), new THREE.Vector2(capR * 0.22, capH * 0.62), new THREE.Vector2(0, capH * 0.62)];
  if (!big) { const n = new THREE.Mesh(new THREE.LatheGeometry(nozPts, 96), mat.plastic(cap)); n.position.y = c1.position.y + capH * 0.27; g.add(n); }
  else { const t = new THREE.Mesh(new THREE.CylinderGeometry(capR * 0.92, capR, 0.25, 96), mat.plastic(cap)); t.position.y = c1.position.y + capH * 0.38; g.add(t); }
  return g;
}

function packBox({ title = 'Replacement\nPods', sub = 'Pack of 2 · 0.8Ω', w = 4.4, h = 6.0, d = 1.6 } = {}) {
  const front = boxFaceTexture({ title, sub });
  const side = boxFaceTexture({ title, sub, w: 400, h: 1400, front: false });
  const plain = new THREE.MeshPhysicalMaterial({ color: 0xfbfbfa, roughness: 0.5, clearcoat: 0.3 });
  const mats = [
    new THREE.MeshPhysicalMaterial({ map: side, roughness: 0.45, clearcoat: 0.3 }),
    new THREE.MeshPhysicalMaterial({ map: side, roughness: 0.45, clearcoat: 0.3 }),
    plain, plain,
    new THREE.MeshPhysicalMaterial({ map: front, roughness: 0.4, clearcoat: 0.4 }),
    new THREE.MeshPhysicalMaterial({ map: side, roughness: 0.45, clearcoat: 0.3 }),
  ];
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats); m.position.y = h / 2;
  const g = new THREE.Group(); g.add(m); return g;
}

const makers = { podKit, podPen, modKit, bottle, packBox };

/* ---------- studio ---------- */
window.renderShot = async function (shot) {
  const [W, H] = shot.size;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(shot.pixelRatio || 2);
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.LinearToneMapping;
  renderer.toneMappingExposure = 0.82;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  document.body.innerHTML = ''; document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  if (shot.bg) scene.background = new THREE.Color(shot.bg);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.environmentIntensity = 0.8;
  scene.environmentRotation = new THREE.Euler(0, 0.9, 0);

  const key = new THREE.DirectionalLight(0xffffff, 3.0);
  key.position.set(-14, 30, 18); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 18; key.shadow.blurSamples = 25;
  const s = 30; Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 100 });
  key.shadow.bias = -0.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 2.0); rim.position.set(18, 10, -16); scene.add(rim);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: shot.shadow ?? 0.22 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  for (const it of shot.items) {
    const obj = makers[it.type](it.opts || {});
    obj.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    obj.position.set(...(it.pos || [0, 0, 0]));
    obj.rotation.set(it.rotX || 0, it.rotY || 0, it.rotZ || 0);
    if (it.scale) obj.scale.setScalar(it.scale);
    scene.add(obj);
  }
  const cam = new THREE.PerspectiveCamera(shot.fov || 22, W / H, 0.1, 500);
  cam.position.set(...shot.cam); cam.lookAt(...shot.target);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  renderer.dispose();
  return url;
};
window.ready = true;
</script>
