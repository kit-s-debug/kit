# Netlify. The site lives in the portfolio folder; everything else builds
# and deploys from there.

[build]
  base = "portfolio"
  command = "npm run build"
  publish = "portfolio/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets never change under the same name, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
