# Netlify. The base is the portfolio folder, but the build has to run from a
# checkout of the whole repo: the prebuild step copies the Eddie Rocks site in
# from the repository root, and that is what makes the case study's
# "View the live site" a real link rather than a dead button.

[build]
  base = "portfolio"
  command = "npm run build"
  publish = "portfolio/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed assets never change under the same name, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
